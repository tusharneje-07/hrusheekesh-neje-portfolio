<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
    /* ─────────────────────────────────────────────
    Layout
    ───────────────────────────────────────────── */
    .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px;
    }
    @media (max-width: 768px) { .wrap { padding: 0 24px; } }
    @media (max-width: 480px) { .wrap { padding: 0 16px; } }

    /* ─────────────────────────────────────────────
    Back Button  (dark pill, top-left)
    ───────────────────────────────────────────── */
    .top-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 18px 0;
    margin-right: 10px;
    margin-left: 10px;
    background: #ffffff;
    position: sticky;
    }

    .top-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    }

    .top-nav::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;

    background: linear-gradient(
        to left ,
        transparent,
        rgba(0, 0, 0, 0.2),
        transparent
    );
    }

    .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #0f0f0f;
    color: #fff;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px 11px 18px;
    border-radius: 50px;
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: background .2s;
    }
    .btn-back:hover { background: #2a2a2a; }
    .btn-back svg { width: 14px; height: 14px; }

    .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    border: 1px solid #d7d7d7;
    background: #0b2742;
    box-shadow: 0 10px 22px rgba(10, 30, 52, 0.25);
    cursor: pointer;
    }
    .theme-toggle img { width: 22px; height: 22px; transition: transform .26s ease, filter .26s ease; }
    .theme-toggle.is-active img { transform: rotate(180deg); }

    /* ─────────────────────────────────────────────
    Project Header — centered
    ───────────────────────────────────────────── */
    .project-header {
    text-align: center;
    padding: 56px 0 0;
    }

    /* Meta row */
    .meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    }
    .meta-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    color: #333;
    font-weight: 500;
    }
    .meta-item img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    }
    .meta-item a { color: inherit; text-decoration: none; }
    .meta-item a:hover { text-decoration: underline; }

    /* Title */
    .project-title {
    font-family: 'Agrandir', 'Manrope', sans-serif;
    font-size: clamp(32px, 32px, 32px);
    color: #0d0d0d;
    line-height: 1.1;
    letter-spacing: -0.025em;
    }

    /* Subtitle */
    .project-subtitle {
    font-size: clamp(14px, 1.7vw, 16.5px);
    color: #666;
    max-width: 620px;
    margin: 0 auto 44px;
    }

    /* Tags — pipe-separated, centered */
    .tags-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 56px;
    }
    .tag-item {
        position: relative;
        padding: 4px 44px;
        text-align: center;
        }

        .tag-item + .tag-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
        height: 20px;
        background: #4CB8E7;
        }
    @media (max-width: 640px) {
    .tags-row { flex-direction: column; align-items: center; gap: 16px; }
    .tag-item + .tag-item::before { display: none; }
    .tag-item { padding: 0 0; }
    }
    .tag-label {
    font-size: 10px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: #0c0c0c;
    }
    .tag-value {
    font-family: 'Agrandir', 'Manrope', sans-serif;
    font-size: 15px;
    color: #111;
    }

    /* Hero image — full width, rounded */
    .hero-img-wrap {
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 96px;
    }
    .hero-img-wrap img { width: 100%; height: auto; display: block; }

    /* ─────────────────────────────────────────────
    Section Label  (orange/amber)
    ───────────────────────────────────────────── */
    .sec-label {
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FE941E;
    margin-bottom: 20px;
    display: block;
    }

    /* ─────────────────────────────────────────────
    Section Heading & Body
    ───────────────────────────────────────────── */
    .sec-title {
    font-family: 'Agrandir', 'Manrope', sans-serif;
    font-size: 1.75rem;
    color: #0d0d0d;
    line-height: 1.15;
    letter-spacing: -0.025em;
    margin-bottom: 22px;
    }
    .sec-body {
    font-size: 16px;
    line-height: 1.8;
    color: #444;
    font-weight: 300;
    }
    .sec-body + .sec-body { margin-top: 16px; }
    .sec-body strong { font-weight: 700; color: #111; }

    /* ─────────────────────────────────────────────
    Sections spacing
    ───────────────────────────────────────────── */
    .section { padding-top: 88px; }
    @media (max-width: 768px) { .section { padding-top: 64px; } }

    /* ─────────────────────────────────────────────
    Before / After  — two rounded outline cards
    ───────────────────────────────────────────── */
    .ba-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 44px;
    }
    @media (max-width: 680px) { .ba-grid { grid-template-columns: 1fr; } }

    .ba-card {
    border: 1.5px solid #e2e2e2;
    border-radius: 20px;
    padding: 36px 32px 40px;
    }
    .ba-card-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 26px;
    }
    .ba-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .ba-list li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 15px;
    line-height: 1.55;
    color: #333;
    }
    .ba-list li::before {
    content: '•';
    color: #bbb;
    font-size: 16px;
    flex-shrink: 0;
    line-height: 1.55;
    }

    /* ─────────────────────────────────────────────
    Large light-sky-blue decorative numbers
    ───────────────────────────────────────────── */
    .big-num {
    font-family: 'Manrope', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: #D5F2FF;
    line-height: 0.9;
    margin-bottom: 12px;
    letter-spacing: -0.04em;
    }

    /* ─────────────────────────────────────────────
    Research Grid  — open, no card borders
    ───────────────────────────────────────────── */
    .research-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 80px;
    row-gap: 56px;
    margin-top: 52px;
    }
    @media (max-width: 680px) { .research-grid { grid-template-columns: 1fr; row-gap: 40px; column-gap: 0; } }

    .r-title {
    font-family: 'Manrope', sans-serif;
    font-size: 1.09rem;
    font-weight: 600;
    color: #0d0d0d;
    margin-bottom: 12px;
    margin-top: 4px;
    }
    .r-body {
    font-size: 15px;
    line-height: 1.72;
    color: #555;
    }

    /* ─────────────────────────────────────────────
    Design Decisions  — numbered blocks
    ───────────────────────────────────────────── */
    .dd-block { margin-top: 64px; }

    .dd-title {
    font-family: 'Manrope', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: #0d0d0d;
    margin-bottom: 14px;
    margin-top: 4px;
    }
    .dd-body {
    font-size: 15.5px;
    line-height: 1.78;
    color: #444;
    max-width: 800px;
    }

    /* Screenshot container — rounded card with border */
    .ss-wrap {
    border-radius: 20px;
    overflow: hidden;
    border: 1.5px solid #ebebeb;
    background: #f4f6fb;
    margin-top: 28px;
    margin: 3.5rem;
    }
    .ss-wrap img { width: 100%; height: auto; display: block; }

    /* Centered italic quote */
    .cs-quote {
        font-family: 'Agrandir', 'Manrope', sans-serif;
    text-align: center;
    font-size: clamp(17px, 2.2vw, 23px);
    color: #111;
    line-height: 1.5;
    padding: 48px 48px;
    font-style: normal;
    }
    .cs-quote::before { content: '\201C'; }
    .cs-quote::after  { content: '\201D'; }
    @media (max-width: 640px) { .cs-quote { padding: 36px 0; font-size: 17px; } }

    /* ─────────────────────────────────────────────
    Visual Language
    ───────────────────────────────────────────── */
    .vl-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 72px;
    margin-top: 48px;
    }
    @media (max-width: 700px) { .vl-cols { grid-template-columns: 1fr; gap: 32px; } }

    .vl-col-title {
    font-family: 'Manrope', sans-serif;
    font-size: 1.09rem;
    font-weight: 600;
    color: #0d0d0d;
    margin-bottom: 14px;
    }
    .vl-col-body {
    font-size: 15px;
    line-height: 1.75;
    color: #555;
    }

    /* Component tags — outlined pills */
    .comp-decisions { margin-top: 52px; }
    .comp-title {
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #0d0d0d;
    margin-bottom: 10px;
    }
    .comp-sub {
    font-size: 15px;
    line-height: 1.7;
    color: #555;
    margin-bottom: 24px;
    }
    .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    }
    .pill {
        font-family: 'Manrope', sans-serif;
        font-weight: 300;
    font-size: 14px;
    color: #222;
    border: 1.5px solid #ccc;
    border-radius: 50px;
    padding: 8px 20px;
    background: transparent;
    }

    /* ─────────────────────────────────────────────
    Outcomes — 4 col open grid, light blue nums
    ───────────────────────────────────────────── */
    .outcomes-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 60px;
    text-align: center;
    }
    @media (max-width: 760px) { .outcomes-grid { grid-template-columns: repeat(2, 1fr); gap: 48px 24px; } }
    @media (max-width: 420px) { .outcomes-grid { grid-template-columns: 1fr; } }

    .outcome-stat {
    font-family: 'Agrandir', 'Manrope', sans-serif;
    font-size: clamp(32px, 4.5vw, 56px);
    font-weight: 800;
    color: #5EC0E4;
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -0.03em;
    }
    .outcome-desc {
    font-size: 14px;
    line-height: 1.65;
    color: #555;
    }

    /* ─────────────────────────────────────────────
    Reflections — same big-num style, 2×2 open
    ───────────────────────────────────────────── */
    .reflections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 80px;
    row-gap: 52px;
    margin-top: 52px;
    }
    @media (max-width: 680px) { .reflections-grid { grid-template-columns: 1fr; column-gap: 0; row-gap: 40px; } }

    .refl-title {
    font-family: 'Manrope', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #0d0d0d;
    margin-bottom: 10px;
    margin-top: 4px;
    }
    .refl-body {
        font-family: 'Manrope', sans-serif;
        font-weight: 300;
    font-size: 15px;
    line-height: 1.72;
    color: #555;
    }

    /* ─────────────────────────────────────────────
    Scroll Reveal
    ───────────────────────────────────────────── */
    .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .65s ease, transform .65s ease;
    }
    .reveal.in {
    opacity: 1;
    transform: translateY(0);
    }

    body[data-theme="dark"] {
    background: #121212;
    color: #eceff4;
    }
    body[data-theme="dark"] .top-nav { background: #121212; }
    body[data-theme="dark"] .project-title,
    body[data-theme="dark"] .sec-title,
    body[data-theme="dark"] .tag-value,
    body[data-theme="dark"] .r-title,
    body[data-theme="dark"] .dd-title,
    body[data-theme="dark"] .vl-col-title,
    body[data-theme="dark"] .comp-title,
    body[data-theme="dark"] .refl-title,
    body[data-theme="dark"] .meta-item,
    body[data-theme="dark"] .tag-label,
    body[data-theme="dark"] .comp-sub,
    body[data-theme="dark"] .pill { color: #f3f5f8; }
    body[data-theme="dark"] .project-subtitle,
    body[data-theme="dark"] .sec-body,
    body[data-theme="dark"] .ba-list li,
    body[data-theme="dark"] .r-body,
    body[data-theme="dark"] .dd-body,
    body[data-theme="dark"] .vl-col-body,
    body[data-theme="dark"] .outcome-desc,
    body[data-theme="dark"] .refl-body { color: #b8c0cd; }
    body[data-theme="dark"] .sec-body strong,
    body[data-theme="dark"] .pill,
    body[data-theme="dark"] .cs-quote { color: #e8edf5; }
    body[data-theme="dark"] .ba-card,
    body[data-theme="dark"] .compare-col,
    body[data-theme="dark"] .insight-card,
    body[data-theme="dark"] .metric-card,
    body[data-theme="dark"] .timeline-card,
    body[data-theme="dark"] .top-card,
    body[data-theme="dark"] .quote-card { background: #1c1c1f; border-color: #34343a; }
    body[data-theme="dark"] .ss-wrap { background: #1c1c1f; border-color: #34343a; }
    body[data-theme="dark"] .pill { border-color: #5a6170; }
    body[data-theme="dark"] .meta-item img { filter: brightness(0) invert(0.92); }
    body[data-theme="dark"] .section[style*="background:#fafbfe"] { background: #17181c !important; }
    body[data-theme="dark"] .theme-toggle { background:#27272e; border-color:#464650; box-shadow: 0 10px 22px rgba(0,0,0,.38); }
    body[data-theme="dark"] .theme-toggle img { filter: brightness(1.15) saturate(0.9); }
    body[data-theme="dark"] .btn-back { background: #26262d; color: #eff3f8; border: 1px solid #44444e; }
    body[data-theme="dark"] .btn-back:hover { background: #2f2f38; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #fff;
      overflow-x: hidden;
      /* no scroll-bar jitter on load */
      scrollbar-gutter: stable;
    }

    /* ── Viewer: full-width column of segments ─────────────────────────────── */
    #viewer {
      width: 100%;
      /* segments are 1920px wide images — let them scale to container */
      display: block;
      line-height: 0; /* kill any inline-block gap between images */
      font-size: 0;
    }

    /* ── Each segment slot ─────────────────────────────────────────────────── */
    .seg-wrap {
      position: relative;
      width: 100%;
      /* Reserve 16:9 space so total page height is correct before images load */
      padding-bottom: 56.25%;
      overflow: hidden;
      background: #f0f0f0;
      /* CRITICAL: zero gap between siblings */
      display: block;
      margin: 0;
      padding-left: 0;
      padding-right: 0;
      border: none;
      outline: none;
    }

    /* Shimmer while loading */
    .seg-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, #ebebeb 30%, #f5f5f5 50%, #ebebeb 70%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      z-index: 0;
    }
    .seg-wrap.loaded::before { display: none; }

    @keyframes shimmer {
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }

    /* The actual image — fills the slot exactly, zero sub-pixel gaps */
    .seg-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      /* contain keeps pixel-perfect alignment; the images are already 16:9 */
      object-fit: fill;
      display: block;
      opacity: 0;
      z-index: 1;
      /* sub-pixel rendering fix — prevents hairline gaps on some GPUs */
      transform: translateZ(0);
      backface-visibility: hidden;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Reveal animation: wipe upward */
    @keyframes wipe-in {
      from { clip-path: inset(100% 0 0 0); opacity: 1; }
      to   { clip-path: inset(0%   0 0 0); opacity: 1; }
    }
    .seg-wrap.loaded img {
      animation: wipe-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── Bottom white fade — masks the loading boundary ───────────────────── */
    #bottom-fade {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 180px;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #ffffff 85%);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #bottom-fade.hidden { opacity: 0; }

    /* ── Error state (only shown if manifest missing / bad prjid) ─────────── */
    #err {
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 80vh;
      gap: 10px;
      text-align: center;
      padding: 32px;
      font-family: system-ui, sans-serif;
      color: #333;
    }
    #err.show { display: flex; }
    #err h2 { font-size: 18px; font-weight: 700; }
    #err p  { font-size: 14px; color: #777; max-width: 380px; line-height: 1.6; }


  </style>

  <body>

    <nav class="top-nav">
      <div class="top-nav-row">
        <a href="./index.html" class="btn-back font-sans">
          <svg viewBox="0 0 14 14" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M9 1.5L3.5 7L9 12.5" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </svg>
          Back
        </a>
        <!-- <button type="button" class="theme-toggle" data-theme-toggle
          aria-label="Switch to dark theme" aria-pressed="false">
          <img src="./assets/images/homepage/theme_toggle.svg" alt>
        </button> -->
      </div>
    </nav>

    <div id="viewer"></div>
    <div id="bottom-fade"></div>

    <footer id="footer" class="relative z-10 w-full px-0 pb-0 mt-10">
      <div class="footer-shell">
        <div class="footer-content reveal in">
          <p class="footer-intro font-agrandir">Looking for product,
            website, or case study design that feels thoughtful and
            conversion-aware?</p>
          <div class="footer-actions">
            <a href="mailto:nhrushee@gmail.com"
              class="footer-primary font-agrandir">Start
              Conversation</a>
            <a href="#hero" class="footer-secondary font-agrandir">Back to
              Top</a>
          </div>
        </div>
        <div class="footer-shots hidden sm:block" aria-hidden="true">
          <img src="./assets/images/homepage/footer_SS1.png"
            alt="Project screenshot 1" class="footer-shot footer-shot-1">
          <img src="./assets/images/homepage/footer_SS2.png"
            alt="Project screenshot 2" class="footer-shot footer-shot-2">
          <img src="./assets/images/homepage/footer_SS3.png"
            alt="Project screenshot 3" class="footer-shot footer-shot-3">
          <img src="./assets/images/homepage/footer_SS4.png"
            alt="Project screenshot 4" class="footer-shot footer-shot-4">
        </div>
        <div class="footer-meta">
          <span id="proj_name" class="footer-name">Hero - Stop Guessing, Start
            Scouting</span>
          <span id="proj_copy" class="footer-copy">© 2026 Hrusheekesh Neje.</span>
        </div>
      </div>
    </footer>

    <div id="err">
      <h2 id="err-title">Something went wrong</h2>
      <p id="err-sub"></p>
    </div>

    <script>
    (async () => {
      const viewer     = document.getElementById('viewer');
      const bottomFade = document.getElementById('bottom-fade');
      const errBox     = document.getElementById('err');

      function showError(title, sub) {
        document.getElementById('err-title').textContent = title;
        document.getElementById('err-sub').textContent   = sub;
        errBox.classList.add('show');
        bottomFade.classList.add('hidden');
      }

      /* ── 1. Read ?prjid ──────────────────────────────────────────────────── */
      const prjidRaw = new URLSearchParams(window.location.search).get('prjid');
      const prjid    = parseInt(prjidRaw, 10);
      if (!prjidRaw || isNaN(prjid) || prjid < 1) {
        showError('No project specified', 'Add ?prjid=1 to the URL to load a portfolio project.');
        return;
      }
      const projectKey = `portfolio_proj_${prjid}`;

      /* ── 2. Load manifest ────────────────────────────────────────────────── */
      let manifest;
      try {
        const res = await fetch('assets/data/portfolio_img.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        manifest = await res.json();
      } catch (e) {
        showError('Manifest not found', `Could not load assets/data/portfolio_img.json. (${e.message})`);
        return;
      }

      /* ── 3. Find project ─────────────────────────────────────────────────── */
      const project = manifest[projectKey];
      if (!project) {
        const ids = Object.keys(manifest).map(k => k.replace('portfolio_proj_', '')).join(', ');
        showError(`Project ${prjid} not found`, `Available IDs: ${ids || 'none'}.`);
        return;
      }

      document.title = `Portfolio`;
      document.getElementById('proj_name').textContent = project.source_pdf.split('_').join(' ').replace('.pdf', '');
      document.getElementById('proj_copy').textContent = `© 2026 Hrusheekesh Neje.`;

      /* ── 4. Inject skeleton wrappers ─────────────────────────────────────── */
      const { segments, image_dir } = project;
      const wrappers = [];
      const frag = document.createDocumentFragment();

      segments.forEach((seg, idx) => {
        const wrap = document.createElement('div');
        wrap.className      = 'seg-wrap';
        wrap.dataset.src    = `${image_dir}/${seg.filename}`;
        wrap.dataset.idx    = idx;
        frag.appendChild(wrap);
        wrappers.push(wrap);
      });

      viewer.appendChild(frag);

      /* ── 5. Progress & completion ─────────────────────────────────────────── */
      let loadedCount = 0;
      const total = segments.length;

      function onSegmentLoaded() {
        loadedCount++;
        if (loadedCount === total) {
          bottomFade.classList.add('hidden');
        }
      }

      /* ── 6. Load function ─────────────────────────────────────────────────── */
      function loadWrap(wrap) {
        if (wrap.dataset.loading) return;
        wrap.dataset.loading = '1';

        const img    = new Image();
        img.decoding = 'async';
        img.alt      = '';

        img.onload = () => {
          wrap.appendChild(img);
          // Double rAF ensures the browser has painted the shimmer before
          // we switch to the loaded state (prevents flash of blank)
          requestAnimationFrame(() => requestAnimationFrame(() => {
            wrap.classList.add('loaded');
          }));
          onSegmentLoaded();
        };

        img.onerror = () => {
          // Silently mark as loaded so progress still completes
          wrap.classList.add('loaded');
          wrap.style.background = '#f8f8f8';
          onSegmentLoaded();
        };

        img.src = wrap.dataset.src;
      }

      /* ── 7. IntersectionObserver — load segments as they near viewport ────── */
      // rootMargin '200%' means we start fetching 2 viewport-heights before visible
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); loadWrap(e.target); } });
      }, { rootMargin: '0px 0px 200% 0px' });

      wrappers.forEach(w => io.observe(w));

      /* ── 8. Eagerly kick off the first 3 segments without waiting for IO ─── */
      [0, 1, 2].forEach(i => { if (wrappers[i]) { io.unobserve(wrappers[i]); loadWrap(wrappers[i]); } });

    })();
  </script>
    <script src="./assets/js/main.js"></script>
  </body>
